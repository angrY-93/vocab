<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <link href="resources/styles/common.css" rel="stylesheet" />
  <link href="resources/styles/index.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="material-symbols-outlined" aria-hidden="true">potted_plant</span>
        <h1>Paper Garden</h1>
      </div>
    </header>

    <main>
      <!--section class="goal-card" aria-label="Today's Goal">
        <h2 class="goal-title">Today&#39;s Goal</h2>
        <p class="goal-subtitle">Complete 3 activities to grow your sprout!</p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="2" aria-label="Daily progress">
          <div class="progress-fill"></div>
        </div>
        <div class="goal-row">
          <span>2 / 3 Activities</span>
          <span>Almost there!</span>
        </div>
      </section-->

      <section class="garden-map" aria-label="Garden Stages">
        <svg class="path-svg" viewBox="0 0 360 730" aria-hidden="true">
          <path d="M190 110 C 220 155, 260 170, 286 255" fill="none" stroke="#a8b9a2" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 13" />
          <path d="M280 447 C 226 475, 170 488, 98 535" fill="none" stroke="#a8b9a2" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 13" />
        </svg>

        <div class="decor left" aria-hidden="true">
          <span class="material-symbols-outlined">eco</span>
        </div>
        <a href="seeding.html" class="stage-link-wrapper" aria-label="Go to Seedling stage page">
          <div class="stage stage-seedling">
            <div class="node seedling">
              <span class="material-symbols-outlined">eco</span>
              <div class="check-pill" aria-hidden="true">✓</div>
            </div>
            <div class="label-pill">SEEDLING</div>
          </div>
        </a>
        <a href="watering.html" class="stage-link-wrapper" aria-label="Go to Watering stage page">
          <div class="stage stage-watering">
            <div class="node watering">
              <span class="active-badge">ACTIVE</span>
              <span class="material-symbols-outlined">water_drop</span>
            </div>
            <div class="label-pill">WATERING</div>
          </div>
        </a>
        <a href="pruning.html" class="stage-link-wrapper" aria-label="Go to Pruning stage page">
          <div class="stage stage-pruning">
            <div class="node pruning">
              <span class="material-symbols-outlined">content_cut</span>
            </div>
            <div class="label-pill">PRUNING</div>
          </div>
        </a>

        <div class="decor right" aria-hidden="true">
          <span class="material-symbols-outlined">local_florist</span>
        </div>
      </section>
    </main>
  </div>

  <!--button class="fab" aria-label="Add activity">
    <span class="material-symbols-outlined" aria-hidden="true">add</span>
  </button-->

  <nav id="app-footer"></nav>
  <script src="resources/js/footer.js"></script>
  <script src="resources/js/index.js"></script>
</body>
</html>
