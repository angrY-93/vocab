<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paper Garden - Home Garden</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#17cf26",
          "background-light": "#f6f8f6",
          "background-dark": "#112112",
        },
        fontFamily: {
          "display": ["Literata", "serif"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  body {
    font-family: 'Literata', serif;
    background-color: theme('colors.background-light');
    color: #2C302E;
  }
  .texture-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden pb-[80px]">
<div class="texture-overlay"></div>
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light/90 backdrop-blur-sm px-6 py-5 flex items-center justify-between border-b border-gray-200">
<h1 class="text-2xl font-bold font-display text-[#2C302E]">Your Garden</h1>
<div class="flex items-center gap-1.5 px-3 py-1.5 bg-orange-50 rounded-full border border-orange-100 shadow-sm">
<span class="text-[#E5A985] font-bold">🔥</span>
<span class="text-[#2C302E] font-semibold text-sm">5 Streak</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 py-8 pb-32">
<!-- Timeline Container -->
<div class="relative pl-6 space-y-10">
<!-- Vertical Line -->
<div class="absolute left-8 top-8 bottom-12 w-0.5 bg-gray-200 z-0"></div>
<!-- Node 1: Seedling -->
<div class="relative z-10">
<!-- Node Dot -->
<div class="absolute -left-[1.35rem] top-4 w-6 h-6 rounded-full bg-primary border-4 border-background-light flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-white"></div>
</div>
<!-- Card -->
<div class="bg-white rounded-lg p-5 shadow-[0_4px_12px_rgba(44,48,46,0.05)] border border-gray-100 cursor-pointer hover:shadow-md transition-shadow group">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="text-xl font-semibold font-display text-[#2C302E]">Seedling</h2>
<p class="text-[#A4ABA6] text-sm mt-0.5">Word Introduction</p>
</div>
<span class="text-[#A4ABA6] text-xs font-medium px-2 py-1 bg-gray-50 rounded-md">5 mins</span>
</div>
<!-- Expanded State (Simulated) -->
<div class="mt-4 pt-4 border-t border-gray-50 hidden group-hover:block transition-all">
<button class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg shadow-sm hover:bg-green-600 transition-colors">Start Module</button>
</div>
</div>
</div>
<!-- Node 2: Watering -->
<div class="relative z-10 opacity-70">
<!-- Node Dot -->
<div class="absolute -left-[1.35rem] top-4 w-6 h-6 rounded-full bg-gray-300 border-4 border-background-light"></div>
<!-- Card -->
<div class="bg-white rounded-lg p-5 shadow-[0_4px_12px_rgba(44,48,46,0.05)] border border-gray-100">
<div class="flex justify-between items-start">
<div>
<h2 class="text-xl font-semibold font-display text-[#2C302E]">Watering</h2>
<p class="text-[#A4ABA6] text-sm mt-0.5">Sentence Practice</p>
</div>
<span class="text-[#A4ABA6] text-xs font-medium px-2 py-1 bg-gray-50 rounded-md">5 mins</span>
</div>
</div>
</div>
<!-- Node 3: Pruning -->
<div class="relative z-10 opacity-50">
<!-- Node Dot -->
<div class="absolute -left-[1.35rem] top-4 w-6 h-6 rounded-full bg-gray-200 border-4 border-background-light"></div>
<!-- Card -->
<div class="bg-white rounded-lg p-5 shadow-[0_4px_12px_rgba(44,48,46,0.05)] border border-gray-100">
<div class="flex justify-between items-start">
<div>
<h2 class="text-xl font-semibold font-display text-[#2C302E]">Pruning</h2>
<p class="text-[#A4ABA6] text-sm mt-0.5">Synonyms &amp; Antonyms</p>
</div>
<span class="text-[#A4ABA6] text-xs font-medium px-2 py-1 bg-gray-50 rounded-md">5 mins</span>
</div>
</div>
</div>
</div>
<!-- Main Action Button -->
<div class="mt-12">
<button class="w-full h-14 bg-primary text-white font-bold text-lg rounded-lg shadow-lg hover:shadow-xl hover:bg-green-600 transition-all flex items-center justify-center gap-2">
        Start Session
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Navigation (Shared Component) -->
<div class="fixed bottom-0 left-0 right-0 w-full z-20">
<div class="flex gap-2 border-t border-[#f0f4f1] bg-white px-4 pb-6 pt-2 shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<a class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-primary" href="#">
<div class="text-primary flex h-8 items-center justify-center" data-icon="House" data-size="24px" data-weight="fill">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<p class="text-primary text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#A4ABA6]" href="#">
<div class="text-[#A4ABA6] flex h-8 items-center justify-center" data-icon="Books" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined">library_books</span>
</div>
<p class="text-[#A4ABA6] text-xs font-medium leading-normal tracking-[0.015em]">Library</p>
</a>
<a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#A4ABA6]" href="#">
<div class="text-[#A4ABA6] flex h-8 items-center justify-center" data-icon="Gear" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined">settings</span>
</div>
<p class="text-[#A4ABA6] text-xs font-medium leading-normal tracking-[0.015em]">Settings</p>
</a>
</div>
</div>
</body></html>
