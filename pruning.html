<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Paper Garden - Pruning Quiz</title>
<script src="resources/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="resources/styles/common.css" rel="stylesheet">
<link href="resources/styles/pruning.css" rel="stylesheet">
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="w-full max-w-md px-container-padding py-4 flex flex-col gap-4 sticky top-0 bg-background-off-white z-40">
<div class="flex items-center justify-between">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Pruning Time</h1>
<div class="flex items-center gap-1 font-label-md text-label-md text-on-surface-variant"></div>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-secondary-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-2/3 transition-all duration-700 ease-out" id="progress-bar"></div>
</div>
</header>

<main class="w-full max-w-md mt-20 px-container-padding pb-32 flex flex-col flex-1">

<!-- Target Word Card -->
<section class="bg-surface-white rounded-xl shadow-sm border border-border-subtle p-inner-card-padding mb-8 relative overflow-hidden text-center">
<div class="absolute -bottom-4 -right-4 opacity-5">
<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: &quot;FILL&quot; 1;">psychology</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-2">Target Word</p>
<h2 class="font-display-lg text-display-lg text-primary mb-1">Courageous</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Which words belong in the garden?</p>
</section>
<!-- Garden Beds (Drop Zones) -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Synonyms Bed -->
<div class="garden-bed min-h-[160px] bg-surface-container-low border-2 border-dashed border-outline-variant rounded-xl p-4 flex flex-col items-center justify-start gap-2 text-center drop-zone-animation" id="synonyms-bed">
<div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: &quot;FILL&quot; 1;">eco</span>
</div>
<h3 class="font-label-md text-label-md text-on-primary-container font-bold">Synonyms</h3>
<div class="flex flex-wrap gap-2 justify-center w-full" id="synonym-chips"></div>
</div>
<!-- Antonyms Bed -->
<div class="garden-bed min-h-[160px] bg-tertiary-fixed border-2 border-dashed border-tertiary-fixed-dim rounded-xl p-4 flex flex-col items-center justify-start gap-2 text-center drop-zone-animation" id="antonyms-bed">
<div class="w-10 h-10 bg-tertiary-container rounded-full flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-variation-settings: &quot;FILL&quot; 1;">content_cut</span>
</div>
<h3 class="font-label-md text-label-md text-on-tertiary-container font-bold">Antonyms</h3>
<div class="flex flex-wrap gap-2 justify-center w-full" id="antonym-chips"></div>
</div>
</div>
<!-- Image Illustration -->

<!-- Word Bank (Chips) -->
<div class="flex flex-wrap gap-3 justify-center mt-8" id="word-bank">
<div class="word-chip px-5 py-3 bg-white border-2 border-border-subtle rounded-full font-button-text text-button-text text-on-surface shadow-sm hover:border-outline transition-all active:scale-90" data-type="synonym" draggable="true" id="word-brave" ondragstart="drag(event)">Brave</div>
<div class="word-chip px-5 py-3 bg-white border-2 border-border-subtle rounded-full font-button-text text-button-text text-on-surface shadow-sm hover:border-outline transition-all active:scale-90" data-type="antonym" draggable="true" id="word-fearful" ondragstart="drag(event)">Fearful</div>
<div class="word-chip px-5 py-3 bg-white border-2 border-border-subtle rounded-full font-button-text text-button-text text-on-surface shadow-sm hover:border-outline transition-all active:scale-90" data-type="synonym" draggable="true" id="word-valiant" ondragstart="drag(event)">Valiant</div>
<div class="word-chip px-5 py-3 bg-white border-2 border-border-subtle rounded-full font-button-text text-button-text text-on-surface shadow-sm hover:border-outline transition-all active:scale-90" data-type="antonym" draggable="true" id="word-cowardly" ondragstart="drag(event)">Cowardly</div>
<div class="word-chip px-5 py-3 bg-white border-2 border-border-subtle rounded-full font-button-text text-button-text text-on-surface shadow-sm hover:border-outline transition-all active:scale-90" data-type="synonym" draggable="true" id="word-bold" ondragstart="drag(event)">Bold</div>
</div>
</main>
<nav id="app-footer"></nav>
<script src="resources/js/footer.js"></script>
<script src="resources/js/pruning.js"></script>

</body></html>
