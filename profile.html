<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <link href="resources/styles/common.css" rel="stylesheet" />
  <link href="resources/styles/index.css" rel="stylesheet" />
  <link href="resources/styles/profile.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="material-symbols-outlined" aria-hidden="true">potted_plant</span>
        <h1>My Profile</h1>
      </div>
    </header>

    <main>
      <section class="profile-layout" aria-label="Learning Summary">
        <div class="profile-card">
          <h2 class="profile-title">Learning Summary</h2>
          <p class="profile-subtitle">Your latest vocabulary progress</p>
          <p class="profile-meta" id="profile-last-completed">Last completed: N/A</p>
          <div class="profile-metrics">
            <article class="metric" aria-label="Last session score">
              <p class="metric-label">Last Session</p>
              <p class="metric-value" id="profile-last-score">N/A</p>
            </article>
            <article class="metric" aria-label="Mastered words count">
              <p class="metric-label">Mastered</p>
              <p class="metric-value" id="profile-mastered-count">0</p>
            </article>
            <article class="metric" aria-label="Unseen words count">
              <p class="metric-label">Unseen</p>
              <p class="metric-value" id="profile-unseen-count">0</p>
            </article>
            <article class="metric" aria-label="In progress words count">
              <p class="metric-label">In Progress</p>
              <p class="metric-value" id="profile-in-progress-count">0</p>
            </article>
          </div>
        </div>
        <div class="decor right" aria-hidden="true">
          <span class="material-symbols-outlined">local_florist</span>
        </div>
      </section>
    </main>
  </div>

  <nav id="app-footer"></nav>
  <script src="resources/js/footer.js"></script>
  <script src="resources/js/vocab-store.js"></script>
  <script src="resources/js/progress-store.js"></script>
  <script src="resources/js/session-store.js"></script>
  <script src="resources/js/profile.js"></script>
</body>
</html>
